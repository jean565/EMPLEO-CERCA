[project]
name = "empleo-cerca-backend"
version = "0.2.0"
description = "Backend de Empleo Cerca con FastAPI y SQL Server sin ORM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "pyodbc>=5.1",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
